<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPal - Stravet Animal Clinic</title>
    <style>
/* Style derived from Page 2 method - Exact Figma visual replica */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background-color: #fff7fc;
    color: #26142f;
    display: flex;
    justify-content: center;
    padding: 16px 8px;
}

.phone {
    width: 100%;
    max-width: 420px;
    background-color: #ffffff;
    border-radius: 20px;
    border: 1px solid #f3e8ee;
    box-shadow: 0 8px 20px rgba(38, 20, 47, 0.06);
    overflow: hidden;
}

.head {
    padding: 14px 18px;
    background-color: #ffffff;
    border-bottom: 1px solid #f3e8ee;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title {
    font-size: 17px;
    font-weight: 700;
    color: #26142f;
}

.sub {
    font-size: 11px;
    color: #584045;
}

.body {
    padding: 14px;
}

.img-box {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #f3e8ee;
}

.img {
    width: 100%;
    display: block;
}

.badge {
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 600;
    background-color: #ffeef4;
    color: #ff5d8d;
    text-decoration: none;
}

.nav {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    background-color: #ffffff;
    border-top: 1px solid #f3e8ee;
}

.item {
    color: #584045;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
}

.item.active {
    color: #ff5d8d;
}
    </style>
</head>
<body>

    <div class="phone">
        
        <!-- Header -->
        <div class="head">
            <div>
                <div class="title">Stravet Animal Clinic</div>
                <div class="sub">⭐ 4.9 • 0.8 miles away • Open till 7 PM</div>
            </div>
            <span class="badge">CHANGE</span>
        </div>

        <!-- Body Content -->
        <div class="body">

            <!-- Visual Figma Screenshot Reference -->
            <div class="img-box">
                <img src="assets/17@2x.png" alt="Stravet Animal Clinic" class="img">
            </div>

        </div>

        <!-- Footer Navigation -->
        <div class="nav">
            <a href="page5.html" class="item">🚨 SOS</a>
            <a href="page15.html" class="item active">🏥 Clinics</a>
            <a href="page11.html" class="item">📅 Schedule</a>

</body>
