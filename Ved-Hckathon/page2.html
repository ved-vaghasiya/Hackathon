<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPal - Pet Parent Sign In</title>
    <style>
/* page2 styling - Exact colors sampled from Figma 2@2x.png */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background-color: #fff7fc;
    color: #26142f;
    display: flex;
    justify-content: center;
    padding: 16px 8px;
}

.phone {
    width: 100%;
    max-width: 420px;
    background-color: #ffffff;
    border-radius: 20px;
    border: 1px solid #f3e8ee;
    box-shadow: 0 8px 20px rgba(38, 20, 47, 0.06);
    overflow: hidden;
}

.head {
    padding: 14px 18px;
    background-color: #ffffff;
    border-bottom: 1px solid #f3e8ee;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title {
    font-size: 17px;
    font-weight: 700;
    color: #26142f;
}

.sub {
    font-size: 11px;
    color: #584045;
}

.body {
    padding: 14px;
}

.img-box {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #f3e8ee;
}

.img {
    width: 100%;
    display: block;
}

.badge {
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 600;
    background-color: #ffeef4;
    color: #ff5d8d;
    text-decoration: none;
}

.nav {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    background-color: #ffffff;
    border-top: 1px solid #f3e8ee;
}

.item {
    color: #584045;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
}

.item.active {
    color: #ff5d8d;
}
    </style>
</head>
<body>

    <div class="phone">
        
        <!-- Header -->
        <div class="head">
            <div>
                <div class="title">PawPal 🐾</div>
                <div class="sub">PET PARENT CARE PORTAL</div>
            </div>
            <span class="badge">PET OWNER</span>
        </div>

        <!-- Body Content -->
        <div class="body">

            <!-- Visual Figma Screenshot Reference -->
            <div class="img-box">
                <img src="assets/2@2x.png" alt="Pet Parent Sign In" class="img">
            </div>

        </div>

        <!-- Footer Navigation -->
        <div class="nav">
            <a href="page2.html" class="item active">🔑 Login</a>
            <a href="page3.html" class="item">📝 Sign Up</a>
            <a href="index.html" class="item">🏥 Vet Portal</a>
        </div>

    </div>

</body>
</html>
